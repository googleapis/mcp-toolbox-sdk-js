name: "API Reference Deployment"
on:
  push:
    branches: [ 'main' ]
    # Only real release tags. Matching '**' also caught release-please-*, which
    # built nothing but still consumed a slot in the concurrency queue.
    tags: [ 'core-v*', 'adk-v*' ]
  workflow_dispatch:

# Keyed per ref, so a release-tag run is never queued behind anything and can
# never be evicted: GitHub holds only one pending run per group, so a third
# push to a shared group cancels the second before it ever starts. Runs may now
# overlap, which is safe because the deploy step retries the gh-pages push.
# Pushes to main still share one group; evicting a superseded "dev" build there
# is harmless, since the newer run rebuilds from newer main.
concurrency:
  group: api-docs-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    # Never run on forks; docs deploy only from the upstream repository.
    if: github.repository == 'googleapis/mcp-toolbox-sdk-js'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        # No `cache:` input is set, so setup-node performs no dependency
        # caching here; there is no runtime cache for a fork PR to poison.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7 # zizmor: ignore[cache-poisoning]
        with:
          node-version: 22.16.0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: '0.152.2'
          extended: true   
          
      - name: Install PostCSS Dependencies
        run: |
          # npm ci installs the exact versions from docs-site/package-lock.json
          # into docs-site/node_modules (where Hugo's PostCSS looks), so the
          # build is reproducible -- a broken upstream patch can't be pulled in.
          # --no-workspaces keeps the install out of the repo-root workspace
          # store; docs-site/package.json pins postcss/postcss-cli/autoprefixer.
          cd docs-site
          npm ci --no-workspaces

      - name: Resolve build target
        id: resolve
        run: |
          # Route the git ref to the package(s) and version to build.
          # A per-package tag builds that one package; pushes to main (and manual
          # dispatch) build both as "dev". JS release tags are hyphenated
          # (core-vX.Y.Z, adk-vX.Y.Z); the trigger filter admits only those, and
          # the catch-all below stays as a backstop for anything unexpected.
          REF="${GITHUB_REF}"
          case "$REF" in
            refs/tags/core-v*) echo "packages=core"     >> "$GITHUB_OUTPUT"; echo "version=${REF#refs/tags/core-}" >> "$GITHUB_OUTPUT" ;;
            refs/tags/adk-v*)  echo "packages=adk"      >> "$GITHUB_OUTPUT"; echo "version=${REF#refs/tags/adk-}"  >> "$GITHUB_OUTPUT" ;;
            refs/tags/*)       echo "packages="         >> "$GITHUB_OUTPUT"; echo "version="                       >> "$GITHUB_OUTPUT" ;;
            *)                 echo "packages=core adk" >> "$GITHUB_OUTPUT"; echo "version=dev"                     >> "$GITHUB_OUTPUT" ;;
          esac

          # Deploys only run upstream (see job-level guard), so always use the
          # production domain.
          echo "BASE_URL=https://js.mcp-toolbox.dev/" >> "$GITHUB_ENV"

      - name: Build workspace packages
        if: steps.resolve.outputs.packages != ''
        run: |
          # adk's docs import @toolbox-sdk/core, whose exported types resolve to
          # build/esm/*.d.ts. Build the workspace so those declarations exist
          # before TypeDoc runs, otherwise adk doc generation fails with TS2307.
          npm ci
          npm run build

      - name: Build per-package docs
        if: steps.resolve.outputs.packages != ''
        run: |
          chmod +x scripts/generate-api-docs.sh
          for PKG in ${STEPS_RESOLVE_OUTPUTS_PACKAGES}; do
            ./scripts/generate-api-docs.sh "$PKG" "${STEPS_RESOLVE_OUTPUTS_VERSION}" "$BASE_URL"
          done
        env:
          STEPS_RESOLVE_OUTPUTS_PACKAGES: ${{ steps.resolve.outputs.packages }}
          STEPS_RESOLVE_OUTPUTS_VERSION: ${{ steps.resolve.outputs.version }}

      - name: Build root page
        if: steps.resolve.outputs.packages != '' && startsWith(github.ref, 'refs/tags/')
        run: |
          chmod +x scripts/generate-root.sh
          ./scripts/generate-root.sh "$BASE_URL"

      # Additive publish: each run only writes its own <package>/<version>/
      # subtree over a fresh checkout of gh-pages, so a run that loses the push
      # race can simply rebuild on top of the winner and push again. CNAME and
      # .nojekyll live on the branch and are preserved by the clone.
      - name: Deploy to gh-pages
        if: steps.resolve.outputs.packages != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          WORK="$(mktemp -d)"
          git clone --depth 1 --branch gh-pages --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$WORK"
          cd "$WORK"

          for attempt in 1 2 3 4 5; do
            # Re-apply the build onto the current tip rather than rebasing, so a
            # concurrent deploy of a different subtree merges cleanly by
            # construction and can never raise a conflict.
            git fetch --depth 1 origin gh-pages
            git reset --hard FETCH_HEAD
            cp -R "${GITHUB_WORKSPACE}/docs-site/public/." .
            git add -A

            if git diff --cached --quiet; then
              echo "No documentation changes for ${GITHUB_REF_NAME}; nothing to deploy."
              exit 0
            fi

            git commit -m "docs(api): deploy ${GITHUB_REF_NAME}"
            if git push origin gh-pages; then
              echo "Deployed ${GITHUB_REF_NAME} to gh-pages on attempt ${attempt}."
              exit 0
            fi

            echo "Push rejected (attempt ${attempt}/5); another deploy landed first. Retrying."
            sleep $(( attempt * 5 ))
          done

          echo "::error::Could not push docs to gh-pages after 5 attempts."
          exit 1
