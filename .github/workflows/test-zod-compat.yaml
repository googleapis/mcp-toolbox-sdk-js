name: zod compatibility
on: # zizmor: ignore[dangerous-triggers]
  pull_request:
    paths:
      - 'packages/**'
      - '!packages/**/*.md'
  # pull_request_target only fires on `labeled`; running fork code is gated
  # behind the maintainer-applied 'tests: run' label (see job `if:` guards),
  # and no secrets or write token are exposed to untrusted fork code.
  pull_request_target:
    types: [labeled]

# Declare default permissions as read only.
permissions: read-all

jobs:
  unit:
    if: "${{ github.event.action != 'labeled' || github.event.label.name == 'tests: run' }}"
    name: unit tests (zod v3 and v4)
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: 'read'
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: false
          # Checking out fork code is gated behind the 'tests: run' label,
          # which requires maintainer review before this workflow runs.
          allow-unsafe-pr-checkout: true
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.16.0
      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npx turbo run compile

      # zod v4 is installed alongside v3 under the `zod4` alias. The runtime
      # suites swap it in via jest moduleNameMapper; the typecheck swaps the
      # declarations in via tsconfig paths. Both are needed: the alias alone
      # does not redirect TypeScript.
      - name: Unit tests against zod v3
        run: npx turbo run test:unit

      - name: Unit tests against zod v4
        run: npx turbo run test:unit:zod4

      - name: Typecheck against zod v4
        run: npx turbo run typecheck:zod4
